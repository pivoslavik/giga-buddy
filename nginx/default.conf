server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* goes to the backend with its method, path, query, headers, cookies and body (#38)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # the backend sees the host the browser asked for and the address of the browser
        # instead of nginx, e.g. for the IP it stores with the refresh session
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
