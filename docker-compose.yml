services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  migrator:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./infra/postgres:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - up
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: ["npm", "run", "build"]
    volumes:
      - frontend_static:/app/dist

volumes:
  postgres_data:
  frontend_static:
