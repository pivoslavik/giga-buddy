services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?jwt secret is not set}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN-}
      COOKIE_SECURE: ${COOOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  ml:
    build: ./ml
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}
      ML_INFERENCE_MAX_WAITING: "${ML_INFERENCE_MAX_WAITING:-2}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_CHAT_MODEL: "${OPENAI_CHAT_MODEL:-}"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 120s

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_USER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  migrator:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./infra/postgres:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      - up
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_static:/usr/share/nginx/html:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: ["npm", "run", "build"]
    volumes:
      - frontend_static:/app/dist

  integration:
    build: ./integration
    environment:
      GOOGLE_DRIVE_CREDENTIALS: /app/credentials.json
      FOLDER_ID: ${FOLDER_ID}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      DB_URL: postgres://${DB_USER}:${DB_USER_PASSWORD}@postgres:5432/${DB_NAME}
      ML_URL: ${ML_URL}
    volumes:
      - ./secrets/google_drive_credentials.json:/app/credentials.json:ro

volumes:
  postgres_data:
  frontend_static:
